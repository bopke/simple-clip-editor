[package]
name = "clip-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clip-core = { path = "../core" }
cpal = "0.18.1"
crossbeam-channel.workspace = true
directories.workspace = true
eframe = "0.36.1"
egui = "0.36.1"
image = "0.25.10"
lzma-rs = "0.3.0"
num_cpus = "1.17.0"
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
tar = "0.4.46"
ureq = "3.4.0"
zip = "8.6.0"

# Free space on a volume has no std API, so it is one syscall per platform.
# Both of these are already in the tree via eframe and cpal, so declaring them
# adds no crate to the dependency graph — only a direct name for what is there.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[lib]
name = "clip_editor"
path = "src/lib.rs"

[[bin]]
name = "clip-editor"
path = "src/main.rs"

[dev-dependencies]
serde_json.workspace = true
