name: Release

on:
  push:
    branches: [main]
  # Handy for re-cutting a build without an empty commit.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs reads the commit, and a shallow clone still has HEAD.
          fetch-depth: 1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libasound2-dev libudev-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libwayland-dev libgl1-mesa-dev pkg-config

      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Short commit
        id: sha
        shell: bash
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # -- macOS: Apple Silicon .app bundle, ad-hoc signed ---------------
      - name: Build macOS bundle
        if: runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/staging
          cp -R "target/Clip Editor.app" dist/staging/
          cp LICENSE README.md dist/staging/
          cp docs/ffmpeg-license.md dist/staging/
          (cd dist/staging && zip -qry "../clip-editor-${{ steps.sha.outputs.short }}-macos-arm64.zip" .)

      # -- Linux ---------------------------------------------------------
      - name: Build Linux
        if: runner.os == 'Linux'
        run: cargo build --release -p clip-editor

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/staging
          cp target/release/clip-editor dist/staging/
          cp LICENSE README.md dist/staging/
          cp docs/ffmpeg-license.md dist/staging/
          tar -C dist/staging -czf "dist/clip-editor-${{ steps.sha.outputs.short }}-linux-x86_64.tar.gz" .

      # -- Windows -------------------------------------------------------
      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release -p clip-editor

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/staging
          cp target/release/clip-editor.exe dist/staging/
          cp LICENSE README.md dist/staging/
          cp docs/ffmpeg-license.md dist/staging/
          (cd dist/staging && 7z a -tzip "../clip-editor-${{ steps.sha.outputs.short }}-windows-x86_64.zip" . >/dev/null)

      - name: Verify the build reports its commit
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo test -p clip-editor --lib version -- --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.artifact }}-tar
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short=7 HEAD)
          TAG="build-$SHORT"
          SUBJECT=$(git log -1 --pretty=%s)

          ls -la artifacts

          # Every distributed archive carries the GPL text; the ffmpeg source
          # link is a licence obligation and belongs in the notes.
          cat > notes.md <<EOF
          Automatic build of \`$SHORT\` on \`main\`.

          > $SUBJECT

          The window title of this build reads **Clip Editor version $SHORT**, so
          you can always tell which one you are running.

          ## Downloads

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | \`clip-editor-$SHORT-macos-arm64.zip\` |
          | Windows x86_64 | \`clip-editor-$SHORT-windows-x86_64.zip\` |
          | Linux x86_64 | \`clip-editor-$SHORT-linux-x86_64.tar.gz\` |

          ffmpeg is **not** bundled: on first launch the app downloads a pinned
          build, verifies its checksum, and stores it in your data directory. The
          first-run screen also offers to use an ffmpeg you already have.

          ## Installing an unsigned build on MacOS

          The app is ad-hoc signed, so it opens with the ordinary
          quarantine prompt. Open it once, then **System Settings → Privacy &
          Security → Open Anyway**.


          ## Licence

          GPL-3.0-or-later. The app runs a GPL ffmpeg build; its source is at
          <https://github.com/FFmpeg/FFmpeg/tree/release/8.1>.
          EOF

          gh release create "$TAG" \
            --title "Clip Editor $SHORT" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            artifacts/*
