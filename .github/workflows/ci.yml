name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push supersedes the run already in flight for that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libasound2-dev libudev-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libwayland-dev libgl1-mesa-dev pkg-config

      # The end-to-end tests run the real pipeline against a real ffmpeg.
      # Without one they skip, which would quietly hollow out the suite, so
      # every runner gets one.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Confirm ffmpeg is present
        shell: bash
        run: |
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1

      # No toolchain named here: `rust-toolchain.toml` is the pin, and naming
      # `stable` as well would mean CI tested a different compiler from the one
      # cargo then selects.
      - name: Install Rust
        shell: bash
        run: rustup toolchain install --no-self-update

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The suite is allowed to skip the ffmpeg-backed tests when no ffmpeg
      # exists; on CI that would be a silent hole. CLIP_REQUIRE_FFMPEG turns
      # each would-be skip into a failure inside the test itself, so the suite
      # only needs to run once and adding a pipeline test needs no change here.
      - name: Tests
        env:
          CLIP_REQUIRE_FFMPEG: 1
        run: cargo test --workspace --verbose

  # The test job above proves the pipeline works against *an* ffmpeg. This one
  # proves it works against *the* ffmpeg: brew, apt and choco each ship a
  # different build from the pinned ones, with different configure flags and
  # codec availability, so `exports_every_preset` passing there says nothing
  # about whether ProRes or VP9 work in the app someone downloads.
  #
  # It also exercises the bootstrap itself — the URLs, the checksums, the
  # extraction — which nothing else does until a user's first run.
  pinned-ffmpeg:
    name: e2e vs the shipped ffmpeg (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libasound2-dev libudev-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libwayland-dev libgl1-mesa-dev pkg-config

      - name: Install Rust
        shell: bash
        run: rustup toolchain install --no-self-update

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Deliberately not cached. The download and the checksum are half of what
      # is under test here, and a cache hit would skip exactly the part that
      # breaks when a vendor moves a file.
      - name: Bootstrap the pinned ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          DIR=$(cargo run -p clip-editor --example install_pinned_ffmpeg)
          echo "Installed to $DIR"
          echo "CLIP_EDITOR_FFMPEG=$DIR" >> "$GITHUB_ENV"

      # `CLIP_EDITOR_FFMPEG` sends the suite at the bootstrapped copy rather
      # than at whatever is on PATH — the runners have their own ffmpeg, and
      # silently testing that one instead is the failure this job exists to
      # prevent.
      - name: End-to-end tests
        env:
          CLIP_REQUIRE_FFMPEG: 1
        shell: bash
        run: cargo test -p clip-editor --test pipeline --verbose
