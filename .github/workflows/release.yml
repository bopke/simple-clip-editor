name: Release

# Gated on CI, not on the push. Tests live in their own workflow, so a release
# triggered by `push: main` cut `build-<sha>` and wrote notes claiming it works
# no matter what the suite said — including when the suite was red. `workflow_run`
# is what makes "CI passed" a precondition rather than a coincidence; the
# `conclusion` check below is the actual gate, since this event fires on failure
# too.
#
# The one test the release job used to run for itself (`--lib version`) checks
# that the window title is non-empty, and ran *after* packaging. It stays, as a
# check that the packaged binary reports the commit — but it is no longer
# standing in for a test suite.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Handy for re-cutting a build without an empty commit. Deliberately not
  # gated: a human asking for a specific build has already decided.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # `workflow_run` runs against the default branch, not against the commit that
  # was tested — so every step that needs the release commit takes it from here
  # rather than from `github.sha`, which would package something CI never saw.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: build (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: windows-latest
            artifact: windows-x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI passed on, not whatever main points at now.
          ref: ${{ env.RELEASE_SHA }}
          # build.rs reads the commit, and a shallow clone still has HEAD.
          fetch-depth: 1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libasound2-dev libudev-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libwayland-dev libgl1-mesa-dev pkg-config

      # The pin in `rust-toolchain.toml`, so the shipped binary is built by the
      # compiler CI tested with.
      - name: Install Rust
        shell: bash
        run: rustup toolchain install --no-self-update

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      - name: Short commit
        id: sha
        shell: bash
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # -- macOS: Apple Silicon .app bundle, ad-hoc signed ---------------
      - name: Build macOS bundle
        if: runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/staging
          cp -R "target/Clip Editor.app" dist/staging/
          cp LICENSE README.md dist/staging/
          (cd dist/staging && zip -qry "../clip-editor-${{ steps.sha.outputs.short }}-macos-arm64.zip" .)

      # -- Linux ---------------------------------------------------------
      - name: Build Linux
        if: runner.os == 'Linux'
        run: cargo build --release -p clip-editor

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/staging
          cp target/release/clip-editor dist/staging/
          cp LICENSE README.md dist/staging/
          tar -C dist/staging -czf "dist/clip-editor-${{ steps.sha.outputs.short }}-linux-x86_64.tar.gz" .

      # -- Windows -------------------------------------------------------
      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release -p clip-editor

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/staging
          cp target/release/clip-editor.exe dist/staging/
          cp LICENSE README.md dist/staging/
          (cd dist/staging && 7z a -tzip "../clip-editor-${{ steps.sha.outputs.short }}-windows-x86_64.zip" . >/dev/null)

      # The release notes tell the user the window title identifies their build.
      # Asserting the exact title is what makes that claim testable: the old
      # check only proved the title was non-empty, which a `dev` stamp or a
      # dirty-tree `+` would also satisfy — and both mean the archive about to
      # be published is not labelled with the commit in its own release notes.
      - name: Verify the build reports the commit being released
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TITLE=$(cargo run --release -p clip-editor --example print_title)
          echo "$TITLE"
          test "$TITLE" = "Clip Editor version ${{ steps.sha.outputs.short }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.artifact }}-tar
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short=7 HEAD)
          TAG="build-$SHORT"
          SUBJECT=$(git log -1 --pretty=%s)

          ls -la artifacts

          # Every distributed archive carries the GPL text (LICENSE). ffmpeg
          # itself is not distributed here — it is downloaded on first run — so
          # the archives carry no separate ffmpeg licence file; the source link
          # for the build the app fetches is a licence obligation and lives in
          # these notes.
          cat > notes.md <<EOF
          Automatic build of \`$SHORT\` on \`main\`.

          > $SUBJECT

          The window title of this build reads **Clip Editor version $SHORT**, so
          you can always tell which one you are running.

          ## Downloads

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | \`clip-editor-$SHORT-macos-arm64.zip\` |
          | Windows x86_64 | \`clip-editor-$SHORT-windows-x86_64.zip\` |
          | Linux x86_64 | \`clip-editor-$SHORT-linux-x86_64.tar.gz\` |

          ffmpeg is **not** bundled: on first launch the app downloads a pinned
          build, verifies its checksum, and stores it in your data directory. The
          first-run screen also offers to use an ffmpeg you already have.

          ## Installing an unsigned build on MacOS

          The app is ad-hoc signed, so it opens with the ordinary
          quarantine prompt. Open it once, then **System Settings → Privacy &
          Security → Open Anyway**.


          ## Licence

          GPL-3.0-or-later. The app runs a GPL ffmpeg build that it downloads on
          first run. The two vendors are not on the same major version, so the
          source depends on which build you received — these mirror the
          per-platform \`SOURCE_URL\` in \`app/src/bootstrap.rs\`, and the app
          shows the same link on its first-run screen.

          | Platform | Pinned ffmpeg | Source |
          |---|---|---|
          | macOS (Apple Silicon) | 9.0 (martin-riedl) | <https://github.com/FFmpeg/FFmpeg/tree/release/9.0> |
          | Windows / Linux | n8.1.2 (BtbN) | <https://github.com/FFmpeg/FFmpeg/tree/release/8.1> |
          EOF

          gh release create "$TAG" \
            --title "Clip Editor $SHORT" \
            --notes-file notes.md \
            --target "$RELEASE_SHA" \
            artifacts/*
